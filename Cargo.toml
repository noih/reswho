[package]
name = "reswho"
version = "1.1.1"
edition = "2024"
description = "Read-only resource attribution for macOS"
license = "MIT"
repository = "https://github.com/noih/reswho"
homepage = "https://github.com/noih/reswho"
readme = "README.md"
keywords = ["macos", "monitor", "process", "tui", "containers"]
categories = ["command-line-utilities"]
include = ["/src/**", "/build.rs", "/schemas/**", "/tests/**", "/scripts/package-release", "/scripts/release", "/scripts/release-notes", "/packaging/reswho.rb.template", "/Cargo.lock", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/CHANGELOG.md", "/docs/**"]

[lib]
doc = false

[[test]]
name = "podman_guard"
path = "tests/podman_guard.rs"
harness = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mach2 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
plist = { version = "1.10", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29.0"
curl = { version = "0.4.51", default-features = false }
node-semver = "2.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[dev-dependencies]
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false }
jsonschema = { version = "0.60.2", default-features = false, features = ["arbitrary-precision"] }

[build-dependencies]
cc = "1"
