[package]
name = "reswho"
version = "0.1.0"
edition = "2024"
publish = false
description = "Read-only resource attribution for macOS"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mach2 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
plist = { version = "1.10", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
curl = { version = "0.4.51", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[dev-dependencies]
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false }
jsonschema = { version = "0.60.2", default-features = false }
